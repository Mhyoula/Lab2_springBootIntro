<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculatrice</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main>
    <h1>Calculatrice</h1>
    <form th:action="@{/calculate}" method="post">
        <label for="firstNumber">Premier nombre</label>
        <input type="number" step="any" id="firstNumber" name="firstNumber"
               th:value="${firstNumber}" required>

        <label for="secondNumber">Second nombre</label>
        <input type="number" step="any" id="secondNumber" name="secondNumber"
               th:value="${secondNumber}" required>

        <label for="operation">Opération</label>
        <select id="operation" name="operation">
            <option value="+" th:selected="${operation == '+'}">+ Addition</option>
            <option value="-" th:selected="${operation == '-'}">− Soustraction</option>
            <option value="*" th:selected="${operation == '*'}">* Multiplication</option>
            <option value="/" th:selected="${operation == '/'}">/ Division</option>
        </select>

        <button type="submit">Calculer</button>
    </form>
    <p class="error" role="alert" th:if="${error != ''}" th:text="${error}"></p>
    <p class="result" th:if="${result != null}">
        Résultat : <output th:text="${result}"></output>
    </p>
</main>
</body>
</html>
